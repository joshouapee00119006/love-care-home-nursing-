<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Nurses - LOVE CARE</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:10px}
.header{background:linear-gradient(90deg,#00c853,#ffeb3b);padding:15px;border-radius:12px;text-align:center;font-weight:bold}
.nurse-card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;display:flex;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.nurse-card img{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #00c853}
.btn{padding:10px 18px;background:#00c853;color:#fff;border:none;border-radius:8px;text-decoration:none;display:inline-block;margin-top:8px;font-weight:bold}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
<div class="header">💖 LOVE CARE GHANA - OUR APPROVED NURSES</div>
<div id="teamList" style="margin-top:15px">Loading nurses...</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",
  authDomain: "web-care-618e8.firebaseapp.com",
  databaseURL: "https://web-care-618e8-default-rtdb.firebaseio.com",
  projectId: "web-care-618e8",
  storageBucket: "web-care-618e8.firebasestorage.app",
  messagingSenderId: "1062578660694",
  appId: "1:1062578660694:web:f94dfe12c929df05bce2f7"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();
db.ref('workers').once('value').then(snap=>{
  const all=snap.val()||{};
  const list=document.getElementById('teamList');
  let html='';
  let count=0;
  Object.values(all).forEach(n=>{
    if(!n.approved) return;
    count++;
    html+=`<div class="nurse-card">
      <img src="${n.photo||'https://via.placeholder.com/90?text=Nurse'}">
      <div><b>👩‍⚕️ ${n.name}</b><br>🎓 ${n.specialization||''}<br>📍 ${n.location||''}<br>⭐ ${n.experience||''} experience<br>
      <a href="https://wa.me/233599447418?text=Hi, I need ${n.name}" class="btn">📲 Book ${n.name.split(' ')[0]}</a>
      </div></div>`;
  });
  if(count===0) html='<p style="text-align:center;padding:30px">No approved nurses yet. Approve in Admin!</p>';
  list.innerHTML=html;
});
</script>
</body>
</html>
