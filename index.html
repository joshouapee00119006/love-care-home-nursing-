<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOVE CARE GLOBAL - Full + Color + Speed + Video + CV + PIN NEW</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
body{margin:0;font-family:Poppins;background:#f0fdf4;padding-bottom:80px}
.header{background:linear-gradient(90deg,#16a34a,#eab308);padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;color:white}
.announcementBar{background:#111827;color:#eab308;padding:10px 0;overflow:hidden;white-space:nowrap;position:sticky;top:62px;z-index:99;border-bottom:3px solid #eab308}
.announcementBar span{display:inline-block;padding-left:100%;animation:marquee 22s linear infinite;font-weight:800;font-size:13px}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.card{background:white;border:2px solid #eab308;border-radius:16px;margin:8px;padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.card h2{color:#16a34a;margin:6px 0;font-size:13px}
input,select,textarea{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid #ccc;box-sizing:border-box;font-family:Poppins}
.btnSubmit{width:100%;padding:11px;border:none;border-radius:10px;font-weight:800;margin-top:6px;cursor:pointer;background:#16a34a;color:white}
.uploadBox{border:2px dashed #16a34a;border-radius:12px;padding:10px;margin:6px 0;background:#f0fdf4}
.page{display:none}.page.active{display:block}
</style>
</head>
<body>
<div id="page-nurse-public" class="page active">
<div class="card" style="border:3px solid #00b050"><h2>👩‍⚕️ Nurse Registration - GPS + Code + Uploads + Intro Video + CV + PIN NEW!</h2>
<input id="nRegName" placeholder="Full Name">
<div class="phoneRow"><select id="nRegPhoneCode"><option value="+233">🇬🇭+233 Ghana</option><option value="+234">🇳🇬+234</option><option value="+1">🇺🇸+1 USA</option><option value="+44">🇬🇧+44 UK</option></select><input id="nRegPhone" placeholder="Phone"></div>
<input id="nRegPass" type="password" placeholder="Password min 6">
<select id="nRegGender"><option value="">-- Gender --</option><option>Female</option><option>Male</option></select>
<input id="nRegAge" type="number" placeholder="Age e.g. 28">
<input id="nRegLocation" placeholder="📍 Tap GPS Auto - Your Area!">
<input id="nRegExperience" type="number" placeholder="Years Experience">
<select id="nRegSpecialty"><option value="">-- Specialty --</option><option>General Nurse</option><option>Midwife</option><option>Elderly Care Specialist</option></select>
<input id="nRegLanguages" placeholder="Languages e.g. English, Twi">

<!-- OLD BOXES - UNCHANGED -->
<div class="uploadBox"><label style="font-size:11px;font-weight:800">📸 Profile Photo (Required)</label><input id="nRegPhoto" type="file" accept="image/*"></div>
<label style="font-size:11px;font-weight:800;margin-top:8px;display:block">🪪 ID Card</label><input id="nRegID" type="file" accept="image/*,application/pdf">
<label style="font-size:11px;font-weight:800;margin-top:8px;display:block">📜 Certificate</label><input id="nRegCert" type="file" accept="image/*,application/pdf">

<!-- NEW BOXES - CV + PIN - ADDED -->
<label style="font-size:11px;font-weight:800;margin-top:10px;display:block;color:#0d47a1;background:#e3f2fd;padding:6px;border-radius:6px">📄 CV / Resume (Required - NEW)</label><input id="nRegCV" type="file" accept="image/*,application/pdf,.doc,.docx">
<label style="font-size:11px;font-weight:800;margin-top:8px;display:block;color:#0d47a1;background:#e3f2fd;padding:6px;border-radius:6px">🪪 NMC PIN Card Photo (Required - NEW)</label><input id="nRegPINCard" type="file" accept="image/*,application/pdf">
<label style="font-size:11px;font-weight:800;margin-top:8px;display:block;color:#0d47a1;background:#e3f2fd;padding:6px;border-radius:6px">🔢 NMC PIN Number (Required - NEW)</label><input id="nRegPINNumber" placeholder="e.g RMN 12345 / RGN 67890">

<label style="font-size:11px;font-weight:800;margin-top:10px;display:block;color:#e91e63">🎥 NEW - 30-sec Intro Video (Clients will watch this!)</label><input id="nRegIntroVideo" type="file" accept="video/*" capture="user">
</div><button class="btnSubmit" onclick="registerNurseFull()">✅ Register</button><div id="nRegStatus" style="font-size:10px;color:green;margin-top:5px"></div></div>
<script>
// YOUR OLD FIREBASE CONFIG - UNCHANGED
const firebaseConfig = {apiKey:"YOUR_KEY",databaseURL:"YOUR_URL"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function registerNurseFull(){
let name=document.getElementById('nRegName').value.trim();
let fullPhone=document.getElementById('nRegPhone').value.trim();
let phone=document.getElementById('nRegPhone').value.trim();
let pass=document.getElementById('nRegPass').value.trim();
let loc=document.getElementById('nRegLocation').value.trim();
if(!name||!phone||!pass||!loc){alert('Name Phone Pass Location required - Use GPS Auto!');return;}

let photoFile=document.getElementById('nRegPhoto').files[0];
let idFile=document.getElementById('nRegID').files[0];
let certFile=document.getElementById('nRegCert').files[0];
let cvFile=document.getElementById('nRegCV').files[0];
let pinCardFile=document.getElementById('nRegPINCard').files[0];
let pinNumber=document.getElementById('nRegPINNumber').value.trim();
let introVideoFile=document.getElementById('nRegIntroVideo').files[0];

if(!photoFile){alert('Upload Photo required');return;}
if(!certFile){alert('Upload Cert required');return;}
if(!cvFile){alert('❌ Upload CV required - NEW!');return;}
if(!pinCardFile){alert('❌ Upload NMC PIN Card required - NEW!');return;}
if(!pinNumber){alert('❌ Enter PIN Number');return;}

let w={name:name,phone:fullPhone,rawPhone:phone,password:pass,location:loc,time:new Date().toLocaleString(),timestamp:Date.now(),status:'pending_approval',photoName:photoFile?photoFile.name:'',idName:idFile?idFile.name:'',certName:certFile?certFile.name:'',cvName:cvFile?cvFile.name:'No CV',pinCardName:pinCardFile?pinCardFile.name:'No PIN Card',pinNumber:pinNumber,introVideoName:introVideoFile?introVideoFile.name:'',hasPhoto:!!photoFile,hasCV:!!cvFile,hasPinCard:!!pinCardFile,approved:false};

document.getElementById('nRegStatus').innerText='⏳ Registering with CV + PIN...';
if(db) db.ref('workers/'+fullPhone.replace(/\+/g,'')).set(w).then(()=>{
document.getElementById('nRegStatus').innerText='✅ Registered '+fullPhone+' CV:'+cvFile.name+' PIN:'+pinNumber+' CEO will approve!';
alert('✅ Registered with CV + PIN! CEO will approve');
});
}
</script>
<script>
// CLIENT MIN 80 VALIDATION - UNCHANGED + ADDED
function submitBookingWithPaystackClosest(){
let budget=document.getElementById('cBudget').value.trim()||"80";
if(parseFloat(budget)<80){alert('❌ Minimum is 80 GHS Boss! Rejected!');return;}
// Your old booking code continues here - Keep your Paystack, GPS, 15/85...
console.log('Booking amount valid:',budget);
}

function loadCEOnursesWithDocs(){
if(!db) return;
db.ref('workers').once('value',s=>{
let data=s.val()||{};
let html='';
Object.values(data).forEach(w=>{
html+=`<div style="border:2px solid #00b050;padding:10px;margin:6px 0"><b>${w.name}</b> - ${w.phone}<br><small>📸${w.photoName} | 📜${w.certName} | 📄 CV:${w.cvName||'❌'} | 🪪 PIN:${w.pinCardName||'❌'} | 🔢 No:${w.pinNumber||'❌'}</small></div>`;
});
document.getElementById('ceoNursesList').innerHTML=html;
});
}
</script>
</body>
</html>
