<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOVE CARE V34.1 - Rotating Winners</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
body{margin:0;font-family:Arial;background:#001a00;color:#fff;padding-bottom:70px}
.header{background:#002a00;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.topBtns button{margin-left:5px;padding:8px 12px;border-radius:8px;border:none;background:#00ff88;color:#000;font-weight:bold}
.page{display:none;padding:12px}.page.active{display:block}
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:#002a00;display:flex;justify-content:space-around;padding:10px;border-top:2px solid #00ff88}
.bottomNav div{padding:8px 15px;border-radius:20px;cursor:pointer}.bottomNav div.active{background:#00ff88;color:#000}
.winnersWalk{overflow:hidden;white-space:nowrap;width:100%;box-sizing:border-box}
@keyframes scrollLeft{0%{transform:translateX(100%)}100%{transform:translateX(-200%)}}
.winnerWalkItem{display:inline-block;background:linear-gradient(90deg,#1a2a00,#0a2a1a);border:2px solid #ffcc00;border-radius:12px;padding:12px 20px;margin:8px 5px;color:#fff;font-weight:bold;min-width:200px;text-align:center}
.moneyItem{background:linear-gradient(90deg,#2a1a00,#2a0a0a)!important;border-color:#00ff88!important}
.scrollContainer{animation:scrollLeft 60s linear infinite;background:#000;padding:10px;border-radius:10px;border:2px solid #ffcc00;overflow:hidden}
.btn{padding:12px 18px;border-radius:10px;border:none;font-weight:bold;cursor:pointer;margin:4px}
.card{background:#0a2a0a;padding:12px;border-radius:12px;margin:8px 0;border:1px solid #00ff88}
input,select{width:95%;padding:12px;border-radius:8px;border:none;margin:5px 0}
.deleteBtn{background:red;color:#fff;padding:5px 10px;border-radius:6px;border:none;margin-left:10px}
</style>
</head>
<body>
<div class="header"><div onclick="tapLogo()" style="font-weight:bold;font-size:18px">💚 LOVE CARE</div><div class="topBtns"><button onclick="showPage('page-home')">Home</button><button onclick="showPage('page-book')">Book</button></div></div>
<div id="page-home" class="page active">
<h2>🏠 Welcome</h2>
<div>Clients: <span id="hClients">0</span> | Nurses: <span id="hNurses">0</span> | Winners: <span id="hWinners">0</span></div>
<h3>🏆 Winners - Free Days then Money - Rotating</h3>
<div class="scrollContainer"><div id="homeWinners" class="winnersWalk"></div></div>
</div>
<div id="page-book" class="page"><div class="card"><h3>Book Care</h3></div></div>
<div id="page-nurse" class="page"><div class="card"><h3>Nurse</h3></div></div>
<div id="page-video" class="page"><div class="card"><h3>Video</h3></div></div>
<div id="page-voice" class="page"><div class="card"><h3>Voice</h3></div></div>
<div id="page-win" class="page"><h3>🏆 WIN</h3><div class="scrollContainer"><div id="referralWinners" class="winnersWalk"></div></div></div>
<div id="page-staff" class="page">
<h3>🏆 Staff - Free Days Rewards</h3>
<button class="btn" style="background:#ff4444" onclick="deleteAllReferrers()">🗑 DELETE ALL</button>
<button class="btn" style="background:#00ff88;color:#000" onclick="createGhostWinners()">👻 CREATE WINNERS 1x</button>
<div id="momoList"></div>
</div>
<div id="page-ceo" class="page"><h3>CEO</h3><div id="ceoMoMoList"></div></div>
<div class="bottomNav">
<div id="nav-home" class="active" onclick="showPage('page-home')">Home</div>
<div onclick="showPage('page-book')">Book</div>
<div onclick="showPage('page-staff')">Staff</div>
<div onclick="showPage('page-ceo')">CEO</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",databaseURL:"https://web-care-618e8-default-rtdb.firebaseio.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
let db=null,allBookings=[],allNurseApps=[],allWorkers=[],staffAccounts=[],allReferrers=[],allColleagues=[],adminConfig={user:'KUSIPETER',pass:'Peterasa80@you!'},isStaffLogged=false,isAdminLogged=false,currentNursePhone=null,nurseGPSData={},selectedConditions=[],conditionFilter='all',currentSelectedPerson=null,audioBlobs={};
try{firebase.initializeApp(firebaseConfig);db=firebase.database();}catch(e){}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}
let logoTaps=0;function tapLogo(){logoTaps++;if(logoTaps>=5){showPage('page-staff');logoTaps=0}}
function getFreeDaysReward(days){if(days>=30)return 5;if(days>=14)return 15;if(days>=7)return 2;if(days>=3)return 2;return 1}
function updateWinnersWalking(){
let w=allReferrers.slice().sort((a,b)=>(b.freeDays||0)-(a.freeDays||0));
let placeholderFree=`<div class="winnerWalkItem">🏆 Yaa Brago won 5 days free</div><div class="winnerWalkItem">🏆 Uncle Ebo won 2 days free</div><div class="winnerWalkItem">🏆 Abena Osei won 15 days free</div><div class="winnerWalkItem">🏆 Kofi Mensah won 2 days free</div><div class="winnerWalkItem">🏆 Akosua won 5 days free</div>`;
let placeholderMoney=`<div class="winnerWalkItem moneyItem">💰 Yaw Antwi won Gh100 from referral</div><div class="winnerWalkItem moneyItem">💰 Ama Fremah won Gh250 from referral</div><div class="winnerWalkItem moneyItem">💰 Kwame Asare won Gh80 from referral</div><div class="winnerWalkItem moneyItem">💰 Yaa Komadu won Gh200 from referral</div>`;
if(w.length===0){
let combined=placeholderFree+placeholderMoney+placeholderFree+placeholderMoney;
document.getElementById('homeWinners').innerHTML=combined;
document.getElementById('referralWinners').innerHTML=combined;
return;
}
let freeHTML=w.map(r=>`<div class="winnerWalkItem">🏆 ${r.name} won ${r.freeDays||0} days free<br><small>📱 ${r.momo||r.phone}</small></div>`).join('');
let moneyHTML=w.map(r=>{let gh=r.earnings||((r.freeDays||0)*40);return `<div class="winnerWalkItem moneyItem">💰 ${r.name} won Gh${gh} from referral<br><small>📱 MoMo: ${r.momo||r.phone}</small></div>`;}).join('');
let finalHTML=freeHTML+moneyHTML+freeHTML+moneyHTML;
document.getElementById('homeWinners').innerHTML=finalHTML;
document.getElementById('referralWinners').innerHTML=finalHTML;
document.getElementById('hWinners').innerText=w.length;
let momoEl=document.getElementById('momoList');if(momoEl)momoEl.innerHTML=w.map(r=>`<div class="card">${r.name} - ${r.freeDays} days free + Gh${r.earnings||r.freeDays*40} - ${r.momo||r.phone} <button onclick="deleteReferrerByKey('${r._key}')" class="deleteBtn">🗑</button></div>`).join('');
let ceoEl=document.getElementById('ceoMoMoList');if(ceoEl)ceoEl.innerHTML=momoEl.innerHTML;
}
function createGhostWinners(){
let names=[{name:'Yaa Brago',momo:'0244123456',freeDays:5,earn:200,count:1},{name:'Uncle Ebo',momo:'0244987654',freeDays:2,earn:80,count:1},{name:'Abena Osei',momo:'0201234567',freeDays:15,earn:600,count:3},{name:'Kofi Mensah',momo:'0244556677',freeDays:2,earn:80,count:1},{name:'Akosua Boateng',momo:'0244778899',freeDays:5,earn:200,count:1},{name:'Yaw Antwi',momo:'0244001122',freeDays:2,earn:100,count:1},{name:'Ama Fremah',momo:'0244334455',freeDays:5,earn:250,count:2}];
names.forEach((g,i)=>{let id='GHOST'+Date.now()+i;db.ref('referrers/'+id).set({name:g.name,momo:g.momo,phone:g.momo,code:'LOVE'+(100+i),count:g.count,freeDays:g.freeDays,earnings:g.earn,time:new Date().toLocaleString(),isGhost:true});});
alert('✅ Created 7 winners - Free Days then Money rotating!');
}
function deleteAllReferrers(){if(!confirm('DELETE ALL?'))return;db.ref('referrers').remove().then(()=>{alert('✅ Deleted! Now CREATE WINNERS');});}
function deleteReferrerByKey(k){if(!confirm('Delete?'))return;db.ref('referrers/'+k).remove();}
function listenBackend(){if(!db)return;db.ref('referrers').on('value',snap=>{allReferrers=[];snap.forEach(child=>{let v=child.val();v._key=child.key;allReferrers.push(v);});updateWinnersWalking();});}
listenBackend();
</script>
</body>
</html>
