<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN - LOVE CARE - FIXED</title>
<style>
body{background:#121212;color:#fff;font-family:sans-serif;padding:10px}
.card{background:#1e1e1e;border-left:4px solid #0f0;border-radius:12px;padding:12px;margin:12px 0}
.badge{padding:4px 8px;border-radius:10px;font-size:12px}
.approved{background:#00c853;color:#fff}
.pending{background:#ff9100;color:#fff}
.btn{border:none;padding:6px 10px;border-radius:8px;margin:2px;font-size:13px;cursor:pointer}
.photo{background:#2a2a72;color:#8ab4f8}
.ghana{background:#3e2723;color:#ffab91}
.cert{background:#1b5e20;color:#a5d6a7}
.cv{background:#3e2723;color:#ffcc80}
.showpw{background:#4a148c;color:#ce93d8}
.approve{background:#00c853;color:#fff}
.delete{background:#d50000;color:#fff}
.reset{background:#0288d1;color:#fff}
.doc-view{margin-top:8px;background:#222;padding:8px;border-radius:8px}
.pw-box{display:none;margin-top:8px;background:#2a2a2a;padding:10px;border-radius:8px}
.btns{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
<h2 style="background:#00c853;padding:12px;border-radius:10px;text-align:center">🔐 BOSS ADMIN + PASSWORD RECOVERY</h2>
<div id="list">Loading...</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",
  authDomain: "web-care-618e8.firebaseapp.com",
  databaseURL: "https://web-care-618e8-default-rtdb.firebaseio.com",
  projectId: "web-care-618e8",
  storageBucket: "web-care-618e8.firebasestorage.app",
  messagingSenderId: "1062578660694",
  appId: "1:1062578660694:web:f94dfe12c929df05bce2f7"
};
if(!firebase.apps.length){firebase.initializeApp(firebaseConfig)}
var db = firebase.database();

function load(){
db.ref('workers').on('value',snap=>{
 var data=snap.val()||{};
 var html='';
 var keys=Object.keys(data);
 if(keys.length===0){html='<p style="text-align:center">No workers</p>'}
 keys.forEach(id=>{
   var n=data[id]||{};
   var isApproved=n.approved||n.isApproved;
   html+=`
   <div class="card">
   <div style="display:flex;gap:10px">
   <img src="${n.photo||'https://via.placeholder.com/60'}" style="width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid ${isApproved?'#0f0':'#f90'}">
   <div>
   <b>👤 ${n.name||'No Name'}</b><br>
   <span>📧 ${n.email||''}</span><br>
   <span>📞 ${n.phone||n.phoneNumber||''}</span><br>
   <span>📍 ${n.age||''} | ${n.category||'Nurse'}</span><br>
   <span class="badge ${isApproved?'approved':'pending'}">${isApproved?'✅ APPROVED':'⏳ PENDING'}</span>
   </div>
   </div>
   <div class="btns">
   <button class="btn photo" onclick="openDoc('${id}','photo')">📷 Photo</button>
   <button class="btn ghana" onclick="openDocFixed('${id}')">💳 Ghana</button>
   <button class="btn cert" onclick="openDoc('${id}','cert')">🎓 Cert</button>
   <button class="btn cv" onclick="openDoc('${id}','cv')">📄 CV</button>
   <button class="btn showpw" onclick="togglePassword('${id}')">👁️ Show PW</button>
   <button class="btn" style="background:#e1f5fe;color:#0288d1" onclick="showTime('${id}')">⏰ Time</button>
   <button class="btn reset" onclick="showReset('${id}')">🔑 Reset</button>
   <button class="btn approve" onclick="approve('${id}')">${isApproved?'✅ Approved':'✅ Approve'}</button>
   <button class="btn delete" onclick="del('${id}')">🗑️ DELETE</button>
   </div>
   <div class="doc-view" id="view-${id}"></div>
   <div class="pw-box" id="pwbox-${id}">
   <b>🔑 Password for ${n.name||''}:</b><br>
   <div style="margin:8px 0">Current: <b id="curr-${id}">${n.pass||n.password||'No password'}</b></div>
   <input type="text" id="newpw-${id}" placeholder="New password" style="width:70%;padding:6px;border-radius:6px">
   <button class="btn reset" onclick="saveNewPassword('${id}')">💾 Save</button>
   <button class="btn delete" onclick="hideReset('${id}')">❌ Close</button>
   </div>
   </div>
   `;
 });
 document.getElementById('list').innerHTML=html;
});
}
load();

function openDoc(id,field){
 db.ref('workers/'+id).once('value').then(s=>{
  var n=s.val()||{};
  var url=n[field]||'';
  if(!url){document.getElementById('view-'+id).innerHTML='<div style="color:red">❌ No document</div>';return;}
  document.getElementById('view-'+id).innerHTML='<iframe src="'+url+'" style="width:100%;height:400px"></iframe><br><a href="'+url+'" target="_blank" style="color:#0f0">Open Full</a> <button onclick="document.getElementById(\'view-'+id+'\').innerHTML=\'\'">Close</button>';
 });
}

function openDocFixed(id){
 db.ref('workers/'+id).once('value').then(s=>{
  var n=s.val()||{};
  var url=n.ghana||n.ghanaCard||n.ghana_card||n.ghanaUrl||n.ghanaID||n.idCard||'';
  var allKeys=Object.keys(n).join(', ');
  if(!url){
    document.getElementById('view-'+id).innerHTML='<div style="color:orange;padding:8px">❌ Ghana field empty!<br>Fields: '+allKeys+'<br>Check Firebase names</div>';
    return;
  }
  document.getElementById('view-'+id).innerHTML='<iframe src="'+url+'" style="width:100%;height:400px"></iframe><br><a href="'+url+'" target="_blank" style="color:#0f0">Open Full</a> <button onclick="document.getElementById(\'view-'+id+'\').innerHTML=\'\'">Close</button>';
 });
}

function showTime(id){
 db.ref('workers/'+id).once('value').then(s=>{
  var n=s.val()||{};
  var reg=n.time||n.registeredAt||'Not set';
  var last=n.lastLogin||'Never logged in yet';
  alert('👩‍⚕️ '+(n.name||id)+'\n📧 '+(n.email||'')+'\n\n📅 Registered: '+reg+'\n🕐 Last Online: '+last);
 });
}

function togglePassword(id){
 var box=document.getElementById('pwbox-'+id);
 box.style.display=box.style.display==='block'?'none':'block';
}
function showReset(id){document.getElementById('pwbox-'+id).style.display='block';}
function hideReset(id){document.getElementById('pwbox-'+id).style.display='none';}

function saveNewPassword(id){
 var np=document.getElementById('newpw-'+id).value.trim();
 if(!np){alert('Enter new password');return;}
 db.ref('workers/'+id).update({pass:np,password:np}).then(()=>{
   document.getElementById('curr-'+id).textContent=np;
   alert('✅ Password updated for BOTH fields! New: '+np);
 });
}
function approve(id){db.ref('workers/'+id).update({approved:true,isApproved:true}).then(()=>alert('✅ Approved'))}
function del(id){if(confirm('Delete '+id+'?')){db.ref('workers/'+id).remove().then(()=>alert('Deleted'))}}
</script>
</body>
</html>
