<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGITAL NURSE - V47 FINAL - ALL MAPS OPEN/CLOSE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f0f7ff}
.header{background:linear-gradient(135deg,#001e4d 0%,#004aad 50%,#00b4d8 100%);color:white;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
.digital-logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo-icon{width:50px;height:50px;background:white;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 20px rgba(0,180,216,0.5)}
.pulse-ring{position:absolute;width:100%;height:100%;border:2px solid #00d9ff;border-radius:14px;animation:pulseRing 2s infinite}
@keyframes pulseRing{0%{transform:scale(1);opacity:1}100%{transform:scale(1.4);opacity:0}}
.logo-text h1{font-size:20px;font-weight:800;letter-spacing:1px;line-height:1}
.logo-text h1 span{color:#00e5ff}
.logo-text p{font-size:9px;letter-spacing:3px;opacity:0.9;margin-top:2px}
.live-badge{background:#ff0033;color:white;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.6}}
.container{max-width:1400px;margin:auto;padding:10px}
.card{background:white;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 15px rgba(0,0,0,0.06);border:1px solid #e3f2fd}
.btn{border:none;padding:11px 16px;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn-map{background:linear-gradient(135deg,#ff6a00,#ff9500);color:white;box-shadow:0 3px 10px rgba(255,106,0,0.3)}
.btn-dark{background:#001e4d;color:white}
.btn-success{background:linear-gradient(135deg,#00b050,#00d68f);color:white}
.map-wrapper{margin-top:12px;border-radius:14px;overflow:hidden;border:2px solid #004aad;transition:all 0.4s ease}
.map-wrapper.hidden{display:none}
.leaflet-map{height:380px;width:100%}
.google-frame{width:100%;height:380px;border:0}
.uber-nurse-card{background:linear-gradient(135deg,#001e4d,#004aad);color:white;border-radius:14px;padding:12px;margin:8px 0;display:flex;align-items:center;gap:12px}
.nurse-dot{width:12px;height:12px;background:#00ff88;border-radius:50%;box-shadow:0 0 0 4px rgba(0,255,136,0.3);animation:pulseDot 1.5s infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(0,255,136,0.7)}70%{box-shadow:0 0 0 10px rgba(0,255,136,0)}100%{box-shadow:0 0 0 0 rgba(0,255,136,0)}}
.hidden{display:none!important}
.badge-live{background:#00ff88;color:#001e4d;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700}
</style>
</head>
<body>
<div class="header">
<div class="digital-logo" onclick="document.getElementById('staffSection').scrollIntoView({behavior:'smooth'})">
<div class="logo-icon"><div class="pulse-ring"></div>
<svg viewBox="0 0 100 100"><path d="M10 50 L30 50 L40 20 L55 80 L65 50 L90 50" stroke="#004aad" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="50" r="6" fill="#00b4d8"/></svg>
</div>
<div class="logo-text"><h1>DIGITAL <span>NURSE</span></h1><p>UBER TRACKING SYSTEM</p></div>
</div>
<div class="live-badge">🔴 LIVE GPS - ALL MAPS OPEN/CLOSE</div>
</div>

<div class="container">

<div class="card">
<h3>👑 CEO DASHBOARD - DIGITAL NURSE</h3>
<div style="margin:10px 0;display:flex;gap:8px;flex-wrap:wrap">
<button class="btn btn-map" onclick="toggleMap('wrapper_ceo')">🗺️ OPEN / CLOSE Google Map</button>
<button class="btn btn-dark" onclick="centerAllLiveNurses('ceoMap')">📍 Locate All Nurses LIVE</button>
<button class="btn btn-success" onclick="startCeoLiveListen()">🔴 Start UBER Live Tracking</button>
</div>
<div id="wrapper_ceo" class="map-wrapper hidden">
<div id="ceoMap" class="leaflet-map"></div>
<iframe id="google_ceo" class="google-frame" src="https://www.google.com/maps?q=5.6037,-0.1870&z=12&output=embed"></iframe>
<div style="padding:8px;background:#001e4d;color:white;font-size:11px;display:flex;justify-content:space-between"><span>🛰️ UBER MODE: Nurses moving live</span><span id="ceoLiveCount">0 Live</span></div>
</div>
<div id="ceoLiveList"></div>
</div>

<div class="card" id="staffSection">
<h3>👔 STAFF PLATFORM</h3>
<div style="margin:10px 0;display:flex;gap:8px;flex-wrap:wrap">
<button class="btn btn-map" onclick="toggleMap('wrapper_staff')">🗺️ OPEN / CLOSE Map</button>
<button class="btn btn-dark" onclick="centerAllLiveNurses('staffMap')">📍 Locate Nurses LIVE</button>
</div>
<div id="wrapper_staff" class="map-wrapper hidden">
<div id="staffMap" class="leaflet-map"></div>
<iframe id="google_staff" class="google-frame" src="https://www.google.com/maps?q=5.6037,-0.1870&z=12&output=embed"></iframe>
</div>
<div id="staffLiveList"></div>
</div>

<div class="card" style="border:2px solid #00b050">
<h3>🧑‍⚕️ NURSE PLATFORM - UBER MODE</h3>
<div style="margin:10px 0;display:flex;gap:8px;flex-wrap:wrap">
<button class="btn btn-success" onclick="startNurseUberTracking()">🟢 START DUTY & LIVE GPS</button>
<button class="btn btn-dark" onclick="stopNurseUberTracking()">🔴 STOP DUTY</button>
<button class="btn btn-map" onclick="toggleMap('wrapper_nurse')">🗺️ OPEN / CLOSE My Map</button>
</div>
<div id="nurseTrackingStatus" style="padding:8px;border-radius:8px;background:#e8f5e9;font-size:12px;margin:8px 0">⚪ Tracking OFF</div>
<div id="wrapper_nurse" class="map-wrapper hidden">
<div id="nurseMap" class="leaflet-map"></div>
<iframe id="google_nurse" class="google-frame" src="https://www.google.com/maps?q=5.6037,-0.1870&z=12&output=embed"></iframe>
</div>
</div>

<div class="card">
<h3>🏠 CLIENT PLATFORM</h3>
<button class="btn btn-map" onclick="toggleMap('wrapper_client')">🗺️ OPEN / CLOSE Map to Track My Nurse</button>
<div id="wrapper_client" class="map-wrapper hidden">
<div id="clientMap" class="leaflet-map"></div>
<iframe id="google_client" class="google-frame" src="https://www.google.com/maps?q=5.6037,-0.1870&z=12&output=embed"></iframe>
<div style="padding:8px;background:#e3f2fd;font-size:11px">Your assigned nurse will appear here moving LIVE like Uber</div>
</div>
<div id="clientLiveNurse"></div>
</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",
  authDomain: "web-care-618e8.firebaseapp.com",
  databaseURL: "https://web-care-618e8-default-rtdb.firebaseio.com",
  projectId: "web-care-618e8",
  storageBucket: "web-care-618e8.firebasestorage.app",
  messagingSenderId: "1062578660694",
  appId: "1:1062578660694:web:f94dfe12c929df05bce2f7"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let maps={}, liveMarkers={}, watchId=null, nursePhone="233000000000", liveLocations={};
function initAllMaps(){
['ceoMap','staffMap','nurseMap','clientMap'].forEach(id=>{
if(document.getElementById(id) &&!maps[id]){
maps[id]=L.map(id).setView([5.6037,-0.1870],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(maps[id]);
}
});
}
function toggleMap(wrapperId){
const el=document.getElementById(wrapperId);
el.classList.toggle('hidden');
if(!el.classList.contains('hidden')){
initAllMaps();
setTimeout(()=>{Object.values(maps).forEach(m=>{if(m) m.invalidateSize()});},300);
}
}
function startNurseUberTracking(){
nursePhone=prompt("Enter your Nurse ID/Phone:","233")+""||"233000000000";
if(!navigator.geolocation){alert("GPS not supported");return;}
document.getElementById('nurseTrackingStatus').innerHTML="🟢 LIVE TRACKING ON - You are visible like UBER";
document.getElementById('nurseTrackingStatus').style.background="#c8e6c9";
watchId=navigator.geolocation.watchPosition(pos=>{
const lat=pos.coords.latitude, lng=pos.coords.longitude, speed=pos.coords.speed||0;
const data={lat,lng,speed,phone:nursePhone,name:"Nurse "+nursePhone.slice(-4),status:"on_duty",timestamp:Date.now(),moving:speed>1};
db.ref('liveLocations/'+nursePhone).set(data);
if(maps.nurseMap){
if(!liveMarkers['me']) liveMarkers['me']=L.marker([lat,lng],{icon:L.divIcon({html:'<div style="background:#00b050;color:white;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:3px solid white">🧑‍⚕️</div>',iconSize:[40,40]})}).addTo(maps.nurseMap);
liveMarkers['me'].setLatLng([lat,lng]); maps.nurseMap.setView([lat,lng],16);
document.getElementById('google_nurse').src=`https://www.google.com/maps?q=${lat},${lng}&z=17&output=embed`;
}
},err=>{alert(err.message)},{enableHighAccuracy:true,maximumAge:0,timeout:5000});
}
function stopNurseUberTracking(){
if(watchId!==null) navigator.geolocation.clearWatch(watchId);
db.ref('liveLocations/'+nursePhone).update({status:"off_duty"});
document.getElementById('nurseTrackingStatus').innerHTML="🔴 Tracking OFF";
}
function startCeoLiveListen(){
initAllMaps();
db.ref('liveLocations').on('value',snap=>{
liveLocations=snap.val()||{};
const ceoList=document.getElementById('ceoLiveList'); const staffList=document.getElementById('staffLiveList');
ceoList.innerHTML=""; staffList.innerHTML=""; let count=0;
Object.values(liveLocations).forEach(n=>{
if(n.status!=="on_duty") return; count++;
['ceoMap','staffMap','clientMap'].forEach(mapId=>{
if(maps[mapId]){
const key=mapId+"_"+n.phone;
if(!liveMarkers[key]){
liveMarkers[key]=L.marker([n.lat,n.lng],{icon:L.divIcon({html:`<div style="background:#001e4d;color:white;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700;border:2px solid #00ff88"><span class="nurse-dot"></span>${n.name}</div>`,iconSize:[90,28]})}).addTo(maps[mapId]);
}else liveMarkers[key].setLatLng([n.lat,n.lng]);
}
});
const html=`<div class="uber-nurse-card"><div class="nurse-dot"></div><div style="flex:1"><b>${n.name}</b><br><small>📍 ${n.lat.toFixed(4)},${n.lng.toFixed(4)} | 🚀 ${(n.speed*3.6).toFixed(0)}km/h ${n.moving?'• MOVING':''}</small></div><div><span class="badge-live">LIVE</span></div><div><button class="btn btn-map" style="padding:6px 10px;font-size:11px" onclick="focusNurse('${n.phone}')">VIEW</button></div></div>`;
ceoList.innerHTML+=html; staffList.innerHTML+=html;
});
document.getElementById('ceoLiveCount').innerText=count+" Live";
});
}
function focusNurse(phone){const n=liveLocations[phone]; if(!n) return; ['ceoMap','staffMap'].forEach(id=>{if(maps[id]) maps[id].setView([n.lat,n.lng],17);});}
function centerAllLiveNurses(mapId){if(!maps[mapId]) initAllMaps(); const locs=Object.values(liveLocations).filter(n=>n.status==="on_duty"); if(locs.length===0){alert("No live nurses");return;} const group=new L.featureGroup(locs.map(n=>L.marker([n.lat,n.lng]))); maps[mapId].fitBounds(group.getBounds().pad(0.3));}
window.onload=()=>{initAllMaps(); startCeoLiveListen();}
</script>
</body>
</html>
