<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Care233 - Staff Portal</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
body{background:#050a07;color:white;font-family:Arial;padding:8px;margin:0}
.card{background:#111;padding:12px;border-radius:16px;max-width:880px;margin:auto;border:2px solid #0a4d2e}
.top{display:flex;align-items:center;gap:15px;justify-content:center;margin-bottom:12px;padding-top:10px}
.icon{width:55px;height:55px;background:#0a4d2e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#ffcc00;font-size:22px;cursor:pointer;border:3px solid #ffcc00;user-select:none;-webkit-user-select:none}
h2{color:#ffcc00;margin:0;text-align:center;font-size:26px}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.tab{padding:9px 10px;border-radius:10px;border:none;font-weight:bold;font-size:11px;cursor:pointer}
.active{background:#0a4d2e;color:#ffcc00}.off{background:#222;color:#ccc}
.box{background:#1a2a1f;padding:12px;border-radius:12px;margin:10px 0;border-left:5px solid #ffcc00}
.box.new{border-left-color:red;background:#2a1f1f}
.btn{padding:9px 12px;border:none;border-radius:8px;font-weight:bold;margin:3px;cursor:pointer;text-decoration:none;display:inline-block;font-size:12px}
.green{background:#0a4d2e;color:#ffcc00}.red{background:#8a0a0a;color:white}.blue{background:#0a2a4d;color:#7fdbc0}.grey{background:#222;color:white}.yellow{background:#4d3a0a;color:#ffcc00}
input,select,textarea{width:100%;padding:13px;margin:6px 0;border-radius:12px;border:2px solid #2a8a6a;background:#1e1e1e;color:white;box-sizing:border-box;font-size:14px}
.small{font-size:11px;color:#8fbc8f}.hidden{display:none!important}
@keyframes flash{0%,100%{background:#1a2a1f}50%{background:#4a0a0a}}
.newFlash{animation: flash 1s infinite}
.docBox{background:#111;padding:10px;border-radius:10px;margin:8px 0;border:1px dashed #ffcc00}
#docModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:99999;padding:10px;box-sizing:border-box;flex-direction:column}
#docModal img{max-width:98%;max-height:80vh;border-radius:12px;border:3px solid #ffcc00;object-fit:contain;background:#000}
.closeBtn{position:absolute;top:15px;right:15px;background:red;color:white;border:none;padding:12px 18px;border-radius:10px;font-weight:bold;font-size:18px;cursor:pointer;z-index:100000}
</style>
</head>
<body>
<div class="card">
<div class="top"><div class="icon" id="adIcon">AD</div><div><h2>STAFFS</h2><p class="small" style="margin:0;text-align:center;color:#7fdbc0">Care233 • Staff Portal</p></div></div>

<div id="loginStaff"><input id="sPhone" placeholder="Phone" type="tel"><input id="sPass" type="password" placeholder="Password"><button class="btn green" style="width:100%;padding:16px;font-size:18px" onclick="loginStaff()">Login</button><p id="sMsg" class="small" style="text-align:center;color:#ff6b6b"></p></div>
<div id="loginSuper" class="hidden"><h3 style="color:#ffcc00;text-align:center">Administrator Access</h3><input id="superPass" type="password" placeholder="Password"><button class="btn green" style="width:100%;padding:16px" onclick="loginSuper()">UNLOCK</button><button class="btn grey" style="width:100%;margin-top:10px;padding:14px" onclick="showStaffLogin()">← Back to Staff Login</button></div>

<div id="dash" class="hidden">
<p style="text-align:center"><b id="userName" style="color:#ffcc00"></b> <button class="btn grey" onclick="logout()" style="float:right">Logout</button></p>
<div style="display:flex;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap"><button id="soundBtn" class="btn yellow" onclick="toggleSound()">🔊 Sound: ON</button><button class="btn blue" onclick="testSound()">Test Sound</button><button class="btn red" onclick="tab('sos')">🚨 SOS <span id="sosCount" class="hidden" style="background:white;color:red;padding:2px 7px;border-radius:10px;font-weight:bold">0</span></button></div>

<div class="tabs">
<button id="tb1" class="tab active" onclick="tab('bookings')">Bookings <span id="newCount" style="background:red;color:white;border-radius:10px;padding:2px 6px" class="hidden">0</span></button>
<button id="tb2" class="tab off" onclick="tab('nurses')">Nurses</button>
<button id="tb3" class="tab off" onclick="tab('jobs')">Jobs</button>
<button id="tb4" class="tab off" onclick="tab('edu')">Talks</button>
<button id="tb6" class="tab off" onclick="tab('video')">Video</button>
<button id="tb7" class="tab off" onclick="tab('sos')">SOS</button>
<button id="tb5" class="tab off" onclick="tab('staff')">Staffs</button>
</div>

<div id="vBookings"><div id="bookList">Loading bookings...</div></div>
<div id="vNurses" class="hidden"><div id="nurseList"></div><h3 style="color:#00ff00">Verified Nurses</h3><div id="approvedList"></div></div>
<div id="vJobs" class="hidden"><input id="jService" placeholder="Service"><input id="jLoc" placeholder="Location"><input id="jPrice" placeholder="Price"><input id="jPhone" placeholder="Client Phone"><button class="btn green" style="width:100%;padding:14px" onclick="createJobManual()">+ CREATE JOB</button></div>
<div id="vEdu" class="hidden"><input id="eTitle" placeholder="Title"><textarea id="eMsg" placeholder="Message" rows="3"></textarea><button class="btn blue" style="width:100%;padding:14px" onclick="sendEdu()">Send Talk</button><div id="eduList"></div></div>
<div id="vVideo" class="hidden"><div style="background:#0f1a2a;padding:14px;border-radius:12px;border:2px solid #2a6aff;margin-bottom:12px"><h3 style="margin:0;color:#7fbcff">Video Talks</h3><input id="vTitle" placeholder="Topic"><select id="vAudience"><option value="both">Both Clients & Nurses</option><option value="clients">Clients Only</option><option value="nurses">Nurses Only</option></select><button class="btn blue" style="width:100%;padding:14px;margin-top:6px" onclick="createVideoTalk()">CREATE VIDEO LINK</button><p id="vLinkBox" class="small"></p></div><div id="videoList"></div></div>
<div id="vSos" class="hidden"><div id="sosList"></div></div>
<div id="vStaff" class="hidden"><div style="background:#2a1a00;padding:14px;border-radius:12px;border:2px solid #ffcc00;margin-bottom:15px"><h4 style="margin:0 0 8px;color:#ffcc00">Change Administrator Password</h4><input id="newSuperPass" type="password" placeholder="New password"><input id="confirmSuperPass" type="password" placeholder="Confirm new password"><button class="btn green" style="width:100%;padding:14px" onclick="changeSuperPass()">Save New Password</button><p id="superPassMsg" class="small"></p></div><div style="background:#0f1f15;padding:12px;border-radius:12px;border:1px dashed #ffcc00"><input id="stName" placeholder="Staff Name"><input id="stPhone" placeholder="Phone" type="tel"><button class="btn green" onclick="addStaff()" style="width:100%;padding:14px">+ Add Staff</button><p id="stMsg" class="small"></p></div><div id="staffList"></div></div>
</div>
</div>

<div id="docModal" onclick="closeDocModal()"><button class="closeBtn" onclick="closeDocModal()">✕ Close</button><img id="docModalImg" src=""><div style="color:#ffcc00;text-align:center;margin-top:10px"><span id="docModalName"></span></div></div>
<audio id="notifSound" preload="auto"><source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg"></audio>
<audio id="sosSound" preload="auto"><source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg"></audio>

<script>
const firebaseConfig = { apiKey: "AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg", authDomain: "web-care-618e8.firebaseapp.com", databaseURL: "https://web-care-618e8-default-rtdb.firebaseio.com", projectId: "web-care-618e8", storageBucket: "web-care-618e8.firebasestorage.app", messagingSenderId: "1062578660694", appId: "1:1062578660694:web:f94dfe12c929df05bce2f7" };
firebase.initializeApp(firebaseConfig); const db = firebase.database();
function getSuperPass(){ return localStorage.getItem('care233_super_pass') || "Peterasa80@you!"; }
let taps=0, tapTimer=null, pressTimer=null, isSuper=false, lastBookingCount=0, lastSosCount=0, soundEnabled=true, firstLoad=true, firstSosLoad=true, allNursesCache=[], approvedNursesCache=[], bookingsCache=[];
const adIcon=document.getElementById('adIcon');
// STEALTH: No visual clue on tap
adIcon.addEventListener('click', handleTap);
adIcon.addEventListener('touchstart', (e)=>{ e.preventDefault(); handleTap(); startPress(); });
adIcon.addEventListener('touchend', ()=>clearTimeout(pressTimer));
adIcon.addEventListener('mousedown', startPress);
adIcon.addEventListener('mouseup', ()=>clearTimeout(pressTimer));
function startPress(){ clearTimeout(pressTimer); pressTimer=setTimeout(openSuperLogin,1500); }
function handleTap(){
  taps++;
  clearTimeout(tapTimer);
  tapTimer=setTimeout(()=>{taps=0;},3000);
  if(taps>=5) openSuperLogin();
}
function openSuperLogin(){
  document.getElementById('loginStaff').className='hidden';
  document.getElementById('loginSuper').className='';
  taps=0;
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}
function showStaffLogin(){document.getElementById('loginSuper').className='hidden';document.getElementById('loginStaff').className='';}
function loginStaff(){ let phone=document.getElementById('sPhone').value.trim(); let pass=document.getElementById('sPass').value.trim(); let staffs=JSON.parse(localStorage.getItem('care233_staffs')||'[]'); let s=staffs.find(x=>x.phone===phone&&x.password===pass); if(!s){document.getElementById('sMsg').innerText='Wrong phone or password';return} if(!s.active){document.getElementById('sMsg').innerText='Account disabled';return} isSuper=false; localStorage.setItem('care233_current_role',JSON.stringify({isSuper:false,staff:s})); openDash(s.name,false); }
function loginSuper(){ let entered=document.getElementById('superPass').value.trim(); if(entered!==getSuperPass()){ alert('Access denied.'); document.getElementById('superPass').value=''; return; } isSuper=true; localStorage.setItem('care233_current_role',JSON.stringify({isSuper:true,name:'CEO'})); openDash('Administrator',true); }
function openDash(name,superFlag){
  document.getElementById('loginStaff').className='hidden';document.getElementById('loginSuper').className='hidden';document.getElementById('dash').className='';
  document.getElementById('userName').innerText=name;
  startApprovedNursesListener(); loadBookingsRealTime(); loadSosRealTime(); loadVideoTalks(); loadNurses(); tab('bookings');
}
function changeSuperPass(){ let newP=document.getElementById('newSuperPass').value.trim(); let c=document.getElementById('confirmSuperPass').value.trim(); if(newP.length<6){document.getElementById('superPassMsg').innerText='Minimum 6 characters';return} if(newP!==c){document.getElementById('superPassMsg').innerText='Passwords do not match';return} localStorage.setItem('care233_super_pass',newP); document.getElementById('superPassMsg').innerHTML=`Password updated`; document.getElementById('newSuperPass').value=''; document.getElementById('confirmSuperPass').value=''; alert('Password changed'); }
function toggleSound(){ soundEnabled=!soundEnabled; document.getElementById('soundBtn').innerText=soundEnabled?'🔊 Sound: ON':'🔇 Sound: OFF'; localStorage.setItem('care233_sound',soundEnabled?'on':'off'); if(soundEnabled) testSound(); }
function testSound(){ document.getElementById('notifSound').play().catch(()=>{}); }
function startApprovedNursesListener(){
  db.ref('nurseApplications').on('value', snap=>{
    let all=[]; snap.forEach(child=>{ all.push(child.val()); });
    allNursesCache=all;
    approvedNursesCache=all.filter(w=>w.approved===true);
    if(bookingsCache.length>0) renderBookings(bookingsCache);
    if(document.getElementById('vNurses').className==='' ) loadNursesUI(all);
  });
}
function loadNursesUI(allWorkers){
    document.getElementById('nurseList').innerHTML=allWorkers.filter(w=>!w.approved).map((w)=>{
      let docs=w.documents||{};
      return `<div class="box" style="border-left-color:orange"><b>${w.name}</b> - ${w.phone}<br><small>License: ${w.licenseNo} | Ghana: ${w.ghanaCardNo}</small><br><div class="docBox">${docs.cv?`<button class="btn blue" onclick="openDocViewerByPhone('${w.phone}','cv',0)">View CV</button>`:''} ${docs.license?`<button class="btn yellow" onclick="openDocViewerByPhone('${w.phone}','license',0)">View License</button>`:''}</div><button class="btn green" onclick="approveN('${w.phone}')">Approve</button><button class="btn red" onclick="rejectN('${w.phone}')">Reject</button></div>`;
    }).join('')||'No pending nurses';
    document.getElementById('approvedList').innerHTML=allWorkers.filter(w=>w.approved).map(w=>`<div class="box" style="border-left-color:#00ff00"><b>${w.name}</b> - ${w.phone} - ${w.skill}<br><small>${w.licenseNo} | ${w.ghanaCardNo} | ${w.location}</small><br><button class="btn red" onclick="unapproveN('${w.phone}')">Unapprove</button></div>`).join('')||'None verified yet';
}
function openDocViewerByPhone(phone, docType, index){
  let w = allNursesCache.find(x=>x.phone===phone); if(!w||!w.documents){alert('No documents');return;}
  let doc=null,name=''; if(docType==='cv'){doc=w.documents.cv;name=doc?.name||'CV';} else if(docType==='license'){doc=w.documents.license;name=doc?.name||'License';} else if(docType==='ghana'){doc=w.documents.ghanaCards?.[index];name=doc?.name||`GH ${index+1}`;}
  if(!doc||!doc.data){alert('No data');return;} let dataUrl=doc.data;
  if(dataUrl.includes('application/pdf')){window.open(dataUrl,'_blank');}else{document.getElementById('docModalImg').src=dataUrl;document.getElementById('docModalName').innerText=`${w.name} - ${name}`;document.getElementById('docModal').style.display='flex';}
}
function closeDocModal(){document.getElementById('docModal').style.display='none';document.getElementById('docModalImg').src='';}
function renderBookings(bookings){
  let approvedFromCache = allNursesCache.filter(w=>w.approved===true);
  let nurses = approvedFromCache.length>0? approvedFromCache : approvedNursesCache;
  let nurseOptions = nurses.length>0? nurses.map(n=>`<option value="${n.name} - ${n.phone}">${n.name} - ${n.phone} - ${n.skill||''}</option>`).join('') : '<option value="">No verified nurses - Verify in Nurses tab</option>';
  let countInfo = nurses.length>0? `${nurses.length} Verified Nurse(s) Ready` : `No verified nurses`;

  document.getElementById('bookList').innerHTML = `<div class="small" style="background:#0a4d2e;padding:10px;border-radius:8px;margin-bottom:10px;text-align:center;color:#ffcc00;font-weight:bold">${countInfo}<br><button class="btn yellow" style="margin-top:6px;padding:6px 12px" onclick="startApprovedNursesListener();loadNurses();">Refresh</button></div>` + bookings.map(j=>{
    let statusBadge='';
    if(j.assignmentStatus==='pending') statusBadge='<span style="background:#ffcc00;color:#000;padding:3px 8px;border-radius:10px">PENDING</span>';
    else if(j.assignmentStatus==='accepted') statusBadge='<span style="background:#00ff00;color:#000;padding:3px 8px;border-radius:10px">ACCEPTED</span>';
    else if(j.assignmentStatus==='rejected') statusBadge='<span style="background:red;color:#fff;padding:3px 8px;border-radius:10px">REJECTED</span>';
    return `<div class="box ${j.status==='new'?'new newFlash':''}">${statusBadge} ${j.assignedNurse?`<span style="background:#0a4d2e;color:#ffcc00;padding:3px 8px;border-radius:10px">👩‍⚕️ ${j.assignedNurse.split(' - ')[0]}</span>`:''}<div style="margin-top:6px"><b>${j.service}</b><br><b>${j.name}</b> - ${j.phone}<br>📍 ${j.location} ${j.price?'- '+j.price:''}<br>${j.notes?`📝 ${j.notes}<br>`:''}</div>
    <div style="background:#111;padding:10px;border-radius:10px;margin:8px 0;border:2px solid #ffcc00">
    <label class="small" style="color:#ffcc00;font-weight:bold">Assign Nurse:</label>
    <select id="assign_${j.id}" style="margin:6px 0;padding:12px"><option value="">-- Select Verified Nurse --</option>${nurseOptions}</select>
    <button class="btn yellow" style="width:100%;padding:14px;font-size:15px" onclick="assignNurse('${j.id}')">Assign Selected Nurse</button>
    <div style="margin-top:8px;padding-top:8px;border-top:1px dashed #555">
    <label class="small">Or assign by phone number:</label>
    <div style="display:flex;gap:5px"><input id="manual_${j.id}" placeholder="e.g. 0596672863" style="flex:1" type="tel"><button class="btn green" onclick="assignByPhone('${j.id}')">Assign by Phone</button></div>
    </div>
    ${j.assignedNurse?`<button class="btn blue" style="margin-top:6px" onclick="unassignNurse('${j.id}')">Clear Assignment</button>`:''}
    </div>
    <div><a class="btn blue" href="tel:${j.phone}">Call Client</a><a class="btn green" target="_blank" href="https://wa.me/${j.phone.replace(/[^0-9]/g,'')}">WhatsApp</a><button class="btn grey" onclick="markDone('${j.id}')">Done</button></div><small>${j.date}</small></div>`;
  }).join('')||'<p class="small">No bookings</p>';
}
function loadBookingsRealTime(){
  db.ref('bookings').orderByChild('timestamp').on('value', snap=>{
    let bookings=[]; snap.forEach(c=>bookings.push({id:c.key,...c.val()})); bookings.reverse();
    bookingsCache=bookings;
    let newCount=bookings.filter(b=>b.status==='new').length;
    let el=document.getElementById('newCount'); if(newCount>0){el.innerText=newCount;el.className='';}else{el.className='hidden';}
    renderBookings(bookings);
  });
}
function assignNurse(id){
  let sel=document.getElementById('assign_'+id);
  if(!sel.value){alert('Select verified nurse');return}
  db.ref('bookings/'+id).update({assignedNurse:sel.value,status:'assigned',assignmentStatus:'pending',assignedAt:Date.now()});
  alert('Assigned to '+sel.value.split(' - ')[0]);
}
function assignByPhone(id){
  let phone=document.getElementById('manual_'+id).value.trim();
  if(!phone){alert('Enter phone');return}
  let nurse = allNursesCache.find(w=>w.phone===phone && w.approved);
  if(!nurse){
    let any = approvedNursesCache.find(w=>w.phone.includes(phone)) || allNursesCache.find(w=>w.phone.includes(phone));
    if(any){ nurse=any; } else { if(!confirm('Assign anyway?')) return; nurse={name:'Nurse '+phone, phone:phone}; }
  }
  let assignStr = `${nurse.name} - ${nurse.phone}`;
  db.ref('bookings/'+id).update({assignedNurse:assignStr,status:'assigned',assignmentStatus:'pending',assignedAt:Date.now()});
  alert('Assigned to '+assignStr);
}
function unassignNurse(id){ db.ref('bookings/'+id).update({assignedNurse:null,status:'new',assignmentStatus:null}); }
function markDone(id){ db.ref('bookings/'+id).once('value').then(s=>{let cur=s.val().status; db.ref('bookings/'+id).update({status:cur==='done'?'new':'done'});});}
function createVideoTalk(){ let title=document.getElementById('vTitle').value.trim()||'Care233 Session'; let audience=document.getElementById('vAudience').value; let roomId='Care233_'+Date.now(); let link=`https://meet.jit.si/${roomId}`; let data={id:roomId,title,audience,link,by:isSuper?'Admin':'Staff',date:new Date().toLocaleString(),timestamp:Date.now()}; db.ref('videoTalks').push(data); document.getElementById('vLinkBox').innerHTML=`<a href="${link}" target="_blank" style="color:#0f0">${link}</a>`; document.getElementById('vTitle').value=''; }
function loadVideoTalks(){ db.ref('videoTalks').orderByChild('timestamp').on('value', snap=>{ let talks=[]; snap.forEach(c=>talks.push({key:c.key,...c.val()})); talks.reverse(); document.getElementById('videoList').innerHTML=talks.map(t=>`<div class="box">🎥 <b>${t.title}</b><br><a class="btn blue" href="${t.link}" target="_blank">Join</a><button class="btn red" onclick="endVideo('${t.key}')">End</button></div>`).join('')||'No videos'; }); }
function endVideo(key){ if(confirm('End?')) db.ref('videoTalks/'+key).remove(); }
function loadSosRealTime(){ db.ref('sosAlerts').orderByChild('timestamp').on('value', snap=>{ let alerts=[]; snap.forEach(c=>alerts.push({key:c.key,...c.val()})); alerts.reverse(); let activeCount=alerts.filter(a=>a.status==='active').length; let el=document.getElementById('sosCount'); if(activeCount>0){el.innerText=activeCount;el.className='';}else{el.className='hidden';} document.getElementById('sosList').innerHTML=alerts.map(a=>`<div class="box"><span style="background:red;color:white;padding:4px 10px;border-radius:12px">SOS ${a.status.toUpperCase()}</span><br><b>${a.nurseName}</b> - ${a.nursePhone}<br>📍 ${a.lat}, ${a.lng}<br><a class="btn blue" href="tel:${a.nursePhone}">Call</a><a class="btn green" target="_blank" href="https://www.google.com/maps?q=${a.lat},${a.lng}">GPS</a><br><button class="btn green" onclick="resolveSos('${a.key}')">Resolve</button><button class="btn red" onclick="deleteSos('${a.key}')">Delete</button></div>`).join('')||'No SOS'; }); }
function resolveSos(key){ db.ref('sosAlerts/'+key).update({status:'resolved'}); }
function deleteSos(key){ if(confirm('Delete?')) db.ref('sosAlerts/'+key).remove(); }
function loadNurses(){
  db.ref('nurseApplications').orderByChild('timestamp').on('value', snap=>{
    let all=[]; snap.forEach(child=>{ all.push(child.val()); }); all.sort((a,b)=>b.timestamp-a.timestamp); allNursesCache=all; approvedNursesCache=all.filter(w=>w.approved===true); loadNursesUI(all); if(bookingsCache.length>0) renderBookings(bookingsCache);
  });
}
function approveN(phone){ db.ref('nurseApplications/'+phone).update({approved:true, care233Verified:true, approvedAt:Date.now()}); db.ref('nurseDocs/'+phone).update({approved:true}); alert('Approved '+phone); }
function unapproveN(phone){ db.ref('nurseApplications/'+phone).update({approved:false}); }
function rejectN(phone){ if(!confirm('Delete '+phone+'?')) return; db.ref('nurseApplications/'+phone).remove(); db.ref('nurseDocs/'+phone).remove(); }
function createJobManual(){ let j={name:'Manual',service:document.getElementById('jService').value,location:document.getElementById('jLoc').value,price:document.getElementById('jPrice').value,phone:document.getElementById('jPhone').value,date:new Date().toLocaleString(),timestamp:Date.now(),status:'new'}; if(!j.service||!j.phone){alert('Fill');return} db.ref('bookings').push(j); alert('Job Created'); }
function tab(t){ ['Bookings','Nurses','Jobs','Edu','Staff','Video','Sos'].forEach(x=>{ let el=document.getElementById('v'+x); if(el) el.className=x.toLowerCase()===t.toLowerCase()?'':'hidden'; let idMap={Bookings:'tb1',Nurses:'tb2',Jobs:'tb3',Edu:'tb4',Staff:'tb5',Video:'tb6',Sos:'tb7'}; let btn=document.getElementById(idMap[x]); if(btn) btn.className=x.toLowerCase()===t.toLowerCase()?'tab active':'tab off'; }); if(t==='staff'&&!isSuper){alert('Access denied');tab('bookings');return;} if(t==='nurses')loadNurses(); if(t==='staff'&&isSuper){loadStaff();} if(t==='edu')loadEdu(); if(t==='video')loadVideoTalks(); if(t==='sos')loadSosRealTime(); }
function addStaff(){let n=document.getElementById('stName').value.trim();let p=document.getElementById('stPhone').value.trim();if(!n||!p){alert('Fill');return}let pass='STAFF'+Math.floor(1000+Math.random()*9000);let s=JSON.parse(localStorage.getItem('care233_staffs')||'[]');s.push({id:Date.now(),name:n,phone:p,password:pass,active:true});localStorage.setItem('care233_staffs',JSON.stringify(s));document.getElementById('stMsg').innerHTML=`Added! Password: <b style="color:#ffcc00">${pass}</b>`;loadStaff();}
function loadStaff(){let s=JSON.parse(localStorage.getItem('care233_staffs')||'[]');document.getElementById('staffList').innerHTML=s.map((x,i)=>`<div class="box"><b>${x.name}</b> - ${x.phone}<br>Pass: <b style="color:#ffcc00">${x.password}</b><br><button class="btn red" onclick="delStaff(${i})">Delete</button></div>`).join('')||'No staffs';}
function delStaff(i){if(!confirm('Delete?'))return;let s=JSON.parse(localStorage.getItem('care233_staffs')||'[]');s.splice(i,1);localStorage.setItem('care233_staffs',JSON.stringify(s));loadStaff();}
function sendEdu(){let t=document.getElementById('eTitle').value;let m=document.getElementById('eMsg').value;if(!t||!m){alert('Fill');return}let e=JSON.parse(localStorage.getItem('care233_edu')||'[]');e.push({title:t,msg:m,date:new Date().toLocaleString()});localStorage.setItem('care233_edu',JSON.stringify(e));document.getElementById('eTitle').value='';document.getElementById('eMsg').value='';loadEdu();}
function loadEdu(){let e=JSON.parse(localStorage.getItem('care233_edu')||'[]');document.getElementById('eduList').innerHTML=e.slice().reverse().map(x=>`<div class="box"><b>${x.title}</b><br>${x.msg}<br><small>${x.date}</small></div>`).join('')||'No talks'}
function logout(){localStorage.removeItem('care233_current_role');location.reload()}
soundEnabled=localStorage.getItem('care233_sound')!=='off';
let cur=JSON.parse(localStorage.getItem('care233_current_role')||'null'); if(cur){isSuper=cur.isSuper;openDash(cur.isSuper?cur.name:cur.staff.name,cur.isSuper);}
</script>
</body>
